# Local development stack. The Steward API and Runtime services are added in Phase 2.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
      POSTGRES_DB: prayog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "steward"]
      interval: 5s
      retries: 10
    volumes:
      - steward-db:/var/lib/postgresql/data

volumes:
  steward-db:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prayog"
version = "0.1.0"
description = "Command-line client for Prayog"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1.0", "blake3>=1.0,<2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prayog = "prayog.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

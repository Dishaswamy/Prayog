<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Steward · Prayog</title>
  <link rel="stylesheet" href="/steward/ui/style.css">
  <script type="module" src="/steward/ui/app.js"></script>
</head>
<body>
  <section id="signin-screen" class="signin-screen" hidden>
    <form id="signin" class="signin-card">
      <div class="brand big"><span class="mark" aria-hidden="true"></span><span>Prayog <strong>Steward</strong></span></div>
      <p class="muted">Sign in with your Prayog account.</p>
      <label class="field"><span>Email or user ID</span>
        <input id="email" type="text" autocomplete="username" required></label>
      <label class="field"><span>Role</span>
        <select id="role" required>
          <option value="STUDENT">Student</option>
          <option value="RESEARCHER">Researcher</option>
          <option value="PROFESSOR">Professor</option>
          <option value="ADMIN">Admin</option>
        </select></label>
      <label class="field"><span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="signin-button" type="submit" class="primary wide">Sign in</button>
      <p id="signin-status" class="status" role="status"></p>
      <p class="fineprint">The Steward reads and reasons about your runs; it never writes, runs or changes anything on its own.</p>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="side-top">
        <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span>Prayog <strong>Steward</strong></span></a>
        <button id="menu" type="button" class="ghost small menu" aria-label="Menu">Menu</button>
      </div>
      <nav id="nav" aria-label="Steward"></nav>
      <div class="side-foot">
        <div id="who" class="who"></div>
        <button id="signout" type="button" class="ghost small">Sign out</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="confirm"></dialog>
</body>
</html>

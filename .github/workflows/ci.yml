name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (platform + Steward integration, end to end)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PRAYOG_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -e "./steward[dev]"
      - name: Tests (real PostgreSQL, real accounts, scheduling passes and releases)
        working-directory: backend
        run: pytest -q

  steward:
    name: steward (lint, types, import rules, traceability, tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: prayog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steward" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      STEWARD_TEST_DATABASE_URL: postgresql+psycopg://steward:steward@localhost:5432/prayog
    defaults:
      run:
        working-directory: steward
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Import rules (SADD §11.1, ADR-S01)
        run: lint-imports
      - name: Traceability (docs/traceability.md names only real tests)
        run: python tools/check_trace.py
      - name: Tests (offline stub reasoning + PostgreSQL)
        run: pytest -q
